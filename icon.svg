<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3b5d"/>
      <stop offset="100%" style="stop-color:#0f2a3f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0c040"/>
      <stop offset="100%" style="stop-color:#e6a817"/>
    </linearGradient>
  </defs>
  
  <!-- خلفية -->
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>
  
  <!-- مفتاح ربط ذهبي (صامولة) -->
  <g transform="translate(256,240)">
    <!-- جسم الصامولة الخارجي -->
    <path d="M-80,-60 L80,-60 L100,0 L80,60 L-80,60 L-100,0 Z" fill="none" stroke="url(#gold)" stroke-width="28" stroke-linejoin="round"/>
    <!-- خط أفقي داخل الصامولة -->
    <line x1="-70" y1="0" x2="70" y2="0" stroke="url(#gold)" stroke-width="20" stroke-linecap="round"/>
    <!-- دائرة مركزية -->
    <circle cx="0" cy="0" r="45" fill="none" stroke="url(#gold)" stroke-width="20"/>
  </g>
  
  <!-- حرف A للأشول -->
  <text x="256" y="410" font-family="Arial, sans-serif" font-size="120" font-weight="bold" fill="url(#gold)" text-anchor="middle" dominant-baseline="middle">A</text>
  
  <!-- قطع غيار صغيرة (مسامير) -->
  <circle cx="160" cy="310" r="8" fill="#f0c040"/>
  <circle cx="352" cy="310" r="8" fill="#f0c040"/>
  <circle cx="256" cy="330" r="8" fill="#f0c040"/>
</svg>